name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  meta:
    name: Meta files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify LICENSE and CHANGELOG
        run: |
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f CHANGELOG.md || (echo "CHANGELOG.md missing" && exit 1)
          test -f README.md || (echo "README.md missing" && exit 1)

  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Excludes src/__tests__ and *.test.ts files — those have pre-existing
      # BetterSQLite3Database generic-mismatch type errors that are out of
      # scope for the docs/meta polish that introduced this CI job.
      - run: npx tsc --noEmit -p .github/workflows/tsconfig.ci.json

  links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in README and CHANGELOG
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/workflows/mlc-config.json'
          file-path: 'README.md, CHANGELOG.md, CONTRIBUTING.md'
